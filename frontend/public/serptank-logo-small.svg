<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="smallCore" cx="35%" cy="25%" r="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="35%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="smallSecondary" cx="65%" cy="75%" r="85%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </radialGradient>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="24" fill="url(#smallCore)" filter="url(#smallGlow)">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.1;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="url(#smallSecondary)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.6)">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.8)"/>
  </g>
</svg>