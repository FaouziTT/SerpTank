<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Core orb gradients matching your SEOOrb component -->
    <radialGradient id="coreOrb" cx="40%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="30%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </radialGradient>
    
    <!-- Secondary layer gradient -->
    <radialGradient id="secondaryOrb" cx="60%" cy="70%" r="70%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </radialGradient>
    
    <!-- Tertiary layer gradient -->
    <radialGradient id="tertiaryOrb" cx="30%" cy="60%" r="60%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Particle gradient -->
    <linearGradient id="particleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light ray gradients -->
    <linearGradient id="rayGradient1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="rayGradient2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="rayGradient3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="orbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner glow filter -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Blur filters for layers -->
    <filter id="blur80">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    
    <filter id="blur60">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    
    <filter id="blur40">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    
    <filter id="blur20">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  
  <!-- Main orb container centered -->
  <g transform="translate(200, 200)">
    
    <!-- Core orb - main layer with heavy blur -->
    <circle cx="0" cy="0" r="120" fill="url(#coreOrb)" filter="url(#blur80)" opacity="1">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.1;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Secondary layer with rotation -->
    <circle cx="0" cy="0" r="90" fill="url(#secondaryOrb)" filter="url(#blur60)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;180;360" dur="20s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.2;1" dur="20s" repeatCount="indefinite" additive="sum"/>
    </circle>
    
    <!-- Tertiary layer with counter-rotation -->
    <circle cx="0" cy="0" r="60" fill="url(#tertiaryOrb)" filter="url(#blur40)" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" 
                        values="360;180;0" dur="15s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" 
                        values="1.2;1;1.2" dur="15s" repeatCount="indefinite" additive="sum"/>
    </circle>
    
    <!-- Inner bright core -->
    <circle cx="0" cy="0" r="30" fill="rgba(255,255,255,0.3)" filter="url(#blur20)">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    
    <!-- Particle system -->
    <!-- Particle 1 -->
    <circle cx="0" cy="0" r="2" fill="url(#particleGradient)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 25,-50; 0,0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 2 -->
    <circle cx="0" cy="0" r="1.5" fill="url(#particleGradient)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -30,-40; 0,0" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 3 -->
    <circle cx="0" cy="0" r="3" fill="url(#particleGradient)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 35,-60; 0,0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 4 -->
    <circle cx="0" cy="0" r="2.5" fill="url(#particleGradient)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -45,-35; 0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 5 -->
    <circle cx="0" cy="0" r="1" fill="url(#particleGradient)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 20,-70; 0,0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Additional floating particles for richness -->
    <circle cx="0" cy="0" r="1.5" fill="#F59E0B" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -20,-80; 0,0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="16s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="2" fill="#EC4899" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 40,-45; 0,0" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    
  </g>
  
</svg>