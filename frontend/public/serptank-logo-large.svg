<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Large format premium gradients -->
    <radialGradient id="largeCore" cx="35%" cy="25%" r="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="10%" style="stop-color:#F8FAFC;stop-opacity:0.7" />
      <stop offset="25%" style="stop-color:#E2E8F0;stop-opacity:0.5" />
      <stop offset="40%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="largeSecondary" cx="65%" cy="75%" r="90%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.8" />
      <stop offset="20%" style="stop-color:#A855F7;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#8B5CF6;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="largeTertiary" cx="20%" cy="80%" r="75%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:0.6" />
      <stop offset="25%" style="stop-color:#F59E0B;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="largeInner" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#E2E8F0;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Large format filters -->
    <filter id="largeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>
    
    <filter id="largeBlur120">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    
    <filter id="largeBlur80">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    
    <filter id="largeBlur40">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  <!-- Large format orb -->
  <g transform="translate(400, 400)">
    
    <!-- Outer halo -->
    <circle cx="0" cy="0" r="300" fill="url(#largeCore)" filter="url(#largeGlow)" opacity="0.2">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.03;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Core orb -->
    <circle cx="0" cy="0" r="240" fill="url(#largeCore)" filter="url(#largeBlur120)" opacity="1">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.05;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="80s" repeatCount="indefinite" additive="sum"/>
    </circle>
    
    <!-- Secondary layer -->
    <circle cx="0" cy="0" r="180" fill="url(#largeSecondary)" filter="url(#largeBlur80)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;180;360" dur="35s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.12;1" dur="25s" repeatCount="indefinite" additive="sum"/>
    </circle>
    
    <!-- Tertiary layer -->
    <circle cx="0" cy="0" r="130" fill="url(#largeTertiary)" filter="url(#largeBlur40)" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" 
                        values="360;180;0" dur="28s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" 
                        values="1.05;1;1.05" dur="18s" repeatCount="indefinite" additive="sum"/>
    </circle>
    
    <!-- Inner bright core -->
    <circle cx="0" cy="0" r="70" fill="url(#largeInner)" opacity="0.9">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.4;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="40" fill="rgba(255,255,255,0.8)">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Enhanced particle system for large format -->
    <circle cx="0" cy="0" r="8" fill="#8B5CF6" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 80,-150; 0,0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.7;0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="6" fill="#F59E0B" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -90,-120; 0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.9;0" dur="25s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="10" fill="#EC4899" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 120,-100; 0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.6;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Orbital rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="2" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="50s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="200" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="1" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" 
                        values="360;0" dur="60s" repeatCount="indefinite"/>
    </circle>
    
  </g>
</svg>