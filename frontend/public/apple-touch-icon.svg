<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="appleIcon" cx="35%" cy="25%" r="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="15%" style="stop-color:#F8FAFC;stop-opacity:0.6" />
      <stop offset="35%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="appleSecondary" cx="65%" cy="75%" r="85%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="appleTertiary" cx="20%" cy="80%" r="70%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.7" />
      <stop offset="40%" style="stop-color:#EC4899;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </radialGradient>
    <filter id="appleGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Rounded square background for iOS -->
  <rect width="180" height="180" rx="40" fill="#1E1B4B"/>
  
  <g transform="translate(90, 90)">
    <circle cx="0" cy="0" r="60" fill="url(#appleIcon)" filter="url(#appleGlow)" opacity="1"/>
    <circle cx="0" cy="0" r="45" fill="url(#appleSecondary)" opacity="0.85"/>
    <circle cx="0" cy="0" r="32" fill="url(#appleTertiary)" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" fill="rgba(255,255,255,0.6)"/>
    <circle cx="0" cy="0" r="10" fill="rgba(255,255,255,0.8)"/>
  </g>
</svg>