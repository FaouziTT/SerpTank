<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Advanced gradients for 3D effect -->
    <linearGradient id="tankFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C2D92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BE185D;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tankTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="searchOrb" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065F46;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#EF4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Advanced shadow and glow effects -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="6" dy="12" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 3D Isometric Tank -->
  <g transform="translate(250, 250)" filter="url(#dropShadow)">
    
    <!-- Tank right side (depth) -->
    <g transform="skewY(-15) scaleY(0.866)">
      <path d="M80,-60 L80,60 L100,40 L100,-40 Z" fill="url(#tankSide)" opacity="0.7"/>
      <ellipse cx="90" cy="-40" rx="20" ry="8" fill="url(#tankSide)" opacity="0.6"/>
      <ellipse cx="90" cy="40" rx="20" ry="8" fill="url(#tankSide)" opacity="0.5"/>
    </g>
    
    <!-- Tank top (isometric) -->
    <g transform="skewX(-30) scaleX(0.866)">
      <ellipse cx="0" cy="-60" rx="80" ry="20" fill="url(#tankTop)"/>
      <!-- Top access port -->
      <circle cx="0" cy="-60" r="12" fill="rgba(255,255,255,0.3)"/>
      <circle cx="0" cy="-60" r="8" fill="rgba(255,255,255,0.1)"/>
    </g>
    
    <!-- Tank front face -->
    <rect x="-80" y="-60" width="160" height="120" rx="25" fill="url(#tankFront)"/>
    
    <!-- Tank front highlights and details -->
    <rect x="-70" y="-50" width="15" height="100" rx="7" fill="rgba(255,255,255,0.25)"/>
    <rect x="-75" y="-55" width="150" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    
    <!-- Volume/pressure gauges -->
    <g transform="translate(-50, -35)">
      <circle cx="0" cy="0" r="15" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="rgba(16,185,129,0.3)"/>
      <line x1="0" y1="0" x2="6" y2="-8" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Digital display panel -->
    <rect x="25" y="-45" width="35" height="20" rx="3" fill="rgba(0,0,0,0.7)"/>
    <rect x="27" y="-43" width="31" height="16" rx="2" fill="rgba(16,185,129,0.2)"/>
    <text x="42.5" y="-35" text-anchor="middle" font-family="monospace" font-size="8" fill="#10B981">SEO</text>
    <text x="42.5" y="-28" text-anchor="middle" font-family="monospace" font-size="6" fill="#10B981">100%</text>
    
    <!-- Level indicators -->
    <line x1="-60" y1="-25" x2="60" y2="-25" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-60" y1="25" x2="60" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    
    <!-- Floating search orb with glow -->
    <g transform="translate(40, -85)" filter="url(#glow)">
      <circle cx="0" cy="0" r="25" fill="url(#searchOrb)"/>
      <circle cx="-8" cy="-8" r="18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
      <line x1="8" y1="8" x2="18" y2="18" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round"/>
      <!-- Search orb inner glow -->
      <circle cx="0" cy="0" r="15" fill="rgba(255,255,255,0.2)"/>
    </g>
    
    <!-- Data visualization streams -->
    <g transform="translate(-35, 10)">
      <!-- Animated-looking data bars -->
      <rect x="0" y="0" width="6" height="25" rx="3" fill="url(#dataFlow)"/>
      <rect x="10" y="-8" width="6" height="33" rx="3" fill="url(#dataFlow)" opacity="0.8"/>
      <rect x="20" y="5" width="6" height="20" rx="3" fill="url(#dataFlow)" opacity="0.9"/>
      <rect x="30" y="-12" width="6" height="37" rx="3" fill="url(#dataFlow)"/>
      <rect x="40" y="2" width="6" height="23" rx="3" fill="url(#dataFlow)" opacity="0.7"/>
      
      <!-- Data points/nodes -->
      <circle cx="3" cy="-5" r="2" fill="#F59E0B"/>
      <circle cx="13" cy="-15" r="2" fill="#EF4444"/>
      <circle cx="23" cy="0" r="2" fill="#F59E0B"/>
      <circle cx="33" cy="-20" r="2" fill="#DC2626"/>
    </g>
    
    <!-- Ranking arrows with 3D effect -->
    <g transform="translate(0, -105)">
      <polygon points="0,-15 12,-3 12,-8 20,-8 20,-22 12,-22 12,-15" fill="url(#searchOrb)" opacity="0.9"/>
      <polygon points="0,-10 8,-2 8,-6 14,-6 14,-14 8,-14 8,-10" fill="#F59E0B" opacity="0.8"/>
    </g>
    
    <!-- Base platform -->
    <ellipse cx="0" cy="70" rx="90" ry="25" fill="rgba(0,0,0,0.1)"/>
    <ellipse cx="0" cy="68" rx="85" ry="20" fill="rgba(0,0,0,0.05)"/>
  </g>
  
  <!-- Company text with 3D effect -->
  <g transform="translate(250, 420)">
    <!-- Shadow text -->
    <text x="2" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="rgba(0,0,0,0.2)">SerpTank</text>
    <!-- Main text -->
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#tankFront)">SerpTank</text>
    
    <!-- Tagline -->
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748B">SEO Decision Superiority Engine</text>
  </g>
  
  <!-- Floating particles for dynamic effect -->
  <g opacity="0.6">
    <circle cx="120" cy="150" r="2" fill="#10B981"/>
    <circle cx="380" cy="200" r="1.5" fill="#F59E0B"/>
    <circle cx="150" cy="350" r="1" fill="#EC4899"/>
    <circle cx="350" cy="100" r="2.5" fill="#8B5CF6"/>
    <circle cx="100" cy="300" r="1.5" fill="#EF4444"/>
  </g>
</svg>