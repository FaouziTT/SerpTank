[project]
name = "serptank"
version = "0.1.0"
description = "SerpTank - Google-first SEO and AI-search visibility platform (API and workers)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
# Runtime dependencies are added module by module (M1 onwards) so that every
# package in the production image has a reviewed reason to be there.
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "import-linter>=2.3",
    "bandit>=1.8",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serptank"]

# -----------------------------------------------------------------------------
# uv
# -----------------------------------------------------------------------------
[tool.uv]
# Reproducible builds: CI runs `uv sync --locked`, which fails if uv.lock is stale.
default-groups = ["dev"]

# -----------------------------------------------------------------------------
# Ruff (lint + format). Replaces black, isort, flake8.
# Legacy code in app/, alembic/ (old baseline), scripts/ and tests_legacy/ is excluded
# until each part is replaced by its roadmap module, then deleted.
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["app", "alembic", "tests_legacy", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "C4", "SIM", "RET", "PT", "PL", "RUF",
    "DTZ",           # timezone-aware datetimes only
    "BLE",           # no blind `except Exception`
    "T20",           # no print()
    "ERA",           # no commented-out code
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

# -----------------------------------------------------------------------------
# mypy: strict for all new code.
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true

# -----------------------------------------------------------------------------
# pytest. The legacy suite in tests_legacy/ cannot run (see docs/execution-plan.md §2.2).
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.coverage.run]
source = ["serptank"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# -----------------------------------------------------------------------------
# import-linter: module boundaries of the modular monolith (see docs/adr/0001).
# Contracts are added as modules land; core must never import feature modules.
# -----------------------------------------------------------------------------
[tool.importlinter]
root_package = "serptank"

[[tool.importlinter.contracts]]
name = "core does not depend on feature modules"
type = "forbidden"
source_modules = ["serptank.core"]
forbidden_modules = ["serptank.modules"]
