
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serptank-backend
  labels:
    app: serptank-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serptank-backend
  template:
    metadata:
      labels:
        app: serptank-backend
    spec:
      containers:
      - name: serptank-backend
        image: your-docker-registry/serptank-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: serptank-backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: serptank-backend-service
spec:
  selector:
    app: serptank-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
