# SerpTank production stack (single hardened VPS, Docker Compose). Module 14.
#
#   Deploy:   see docs/runbooks/deploy.md (images come from GHCR, pinned by tag/digest)
#   Secrets:  files under ./secrets/ (decrypted from sops at deploy time, never in git),
#             mounted as Docker secrets at /run/secrets/<name> and read by the app.
#
# Third-party images are pinned by digest (Renovate keeps them current).
# Only Caddy publishes ports. Networks are segmented:
#   edge      caddy <-> web <-> api                         (no data stores)
#   backend   api/worker/beat/migrate <-> postgres/redis    (internal: no internet)
#   render    worker <-> renderer                           (internal)
#   egress    api/worker/renderer -> internet (OAuth, Stripe, crawls, SERP/LLM vendors),
#             every outbound request filtered in-process by SafeHttpClient
name: serptank

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  SERPTANK_ENVIRONMENT: production
  SERPTANK_PUBLIC_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
  SERPTANK_ALLOWED_HOSTS: ${SITE_DOMAIN},api
  SERPTANK_TRUSTED_PROXIES: 172.30.10.0/24
  SERPTANK_JOBS_BACKEND: celery
  SERPTANK_EMAIL_BACKEND: smtp
  SERPTANK_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SERPTANK_SMTP_PORT: ${SMTP_PORT:-587}
  SERPTANK_SMTP_USERNAME: ${SMTP_USERNAME:-}
  SERPTANK_SMTP_STARTTLS: "true"
  SERPTANK_EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  SERPTANK_WEBAUTHN_RP_ID: ${SITE_DOMAIN}
  SERPTANK_RENDERER_URL: http://renderer:8100
  SERPTANK_LOG_JSON: "true"

x-app-secrets: &app-secrets
  - serptank_database_url
  - serptank_redis_url
  - serptank_session_secret
  - serptank_csrf_secret
  - serptank_api_key_pepper
  - serptank_encryption_keys
  - serptank_smtp_password
  - serptank_renderer_token
  - serptank_google_client_secret
  - serptank_google_data_client_secret
  - serptank_stripe_secret_key
  - serptank_stripe_webhook_secret
  - serptank_openai_api_key
  - serptank_dataforseo_password

services:
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: { ipv4_address: 172.30.10.10 }
    depends_on: [web, api]
    deploy: { resources: { limits: { cpus: "1", memory: 256m } } }

  web:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/serptank-web:${RELEASE:?set RELEASE}
    environment:
      SERPTANK_INTERNAL_API_URL: http://api:8000
      SERPTANK_SITE_URL: https://${SITE_DOMAIN}
      SERPTANK_LEGAL_ENTITY: ${LEGAL_ENTITY:-}
      SERPTANK_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      SERPTANK_LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:-}
      SERPTANK_PRIVACY_EMAIL: ${PRIVACY_EMAIL:-}
      SERPTANK_SECURITY_EMAIL: ${SECURITY_EMAIL:-}
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=256m,uid=1000"]
    networks: [edge]
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }

  api:
    <<: *hardening
    env_file: [./config/app.env]
    image: ghcr.io/${GHCR_OWNER}/serptank-api:${RELEASE}
    environment:
      <<: *app-env
      SERPTANK_METRICS_PORT: "9100"
      SERPTANK_METRICS_BIND_ADDRESS: 0.0.0.0
    secrets: *app-secrets
    networks:
      edge: { ipv4_address: 172.30.10.20 }
      backend: {}
      egress: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }

  worker:
    <<: *hardening
    env_file: [./config/app.env]
    image: ghcr.io/${GHCR_OWNER}/serptank-api:${RELEASE}
    command: ["celery", "-A", "serptank.workers.app", "worker",
              "-Q", "default,crawl,serp,integrations,ai,reports",
              "-c", "${WORKER_CONCURRENCY:-4}", "--without-gossip", "--without-mingle"]
    environment: *app-env
    secrets: *app-secrets
    networks: [backend, render, egress]
    healthcheck:
      test: ["CMD", "celery", "-A", "serptank.workers.app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "10"]
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  beat:
    <<: *hardening
    env_file: [./config/app.env]
    image: ghcr.io/${GHCR_OWNER}/serptank-api:${RELEASE}
    command: ["celery", "-A", "serptank.workers.app", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    secrets:
      - serptank_database_url
      - serptank_redis_url
      - serptank_scheduler_database_url
      - serptank_session_secret
      - serptank_csrf_secret
      - serptank_api_key_pepper
      - serptank_encryption_keys
      - serptank_smtp_password
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

  renderer:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER}/serptank-renderer:${RELEASE}
    environment:
      SERPTANK_ENVIRONMENT: production
      SERPTANK_COMPONENT: renderer
    secrets: [serptank_renderer_token]
    # Chromium needs a writable profile dir and shared memory; nothing else.
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/renderer:size=128m,uid=10002"]
    shm_size: 512m
    networks: [render, egress]
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  migrate:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER}/serptank-api:${RELEASE}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      SERPTANK_ENVIRONMENT: production
    # Migrations run as the schema owner; the API/workers never get this credential.
    secrets:
      - source: serptank_owner_database_url
        target: serptank_database_url
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: timescale/timescaledb-ha:pg17@sha256:3e3440ab4c2aa585e743b1d8466cda9bbf18b6c598ec7806cf61e02fa5cd1d1a
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: serptank
      POSTGRES_DB: serptank
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_SCHED_PASSWORD_FILE: /run/secrets/postgres_sched_password
    secrets: [postgres_owner_password, postgres_app_password, postgres_sched_password]
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serptank -d serptank"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { cpus: "2", memory: 4g } } }

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec redis-server --appendonly yes --dir /data
        --requirepass "$$(cat /run/secrets/redis_password)"
        --rename-command FLUSHALL "" --rename-command CONFIG "" --rename-command DEBUG ""
        --maxmemory 512mb --maxmemory-policy noeviction
    secrets: [redis_password]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- optional: metrics and alerting (docker compose --profile monitoring up -d) ---
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [backend, edge]
    # Reach it through an SSH tunnel: ssh -L 9090:127.0.0.1:9090 host
    ports: ["127.0.0.1:9090:9090"]

networks:
  edge:
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  backend:
    internal: true
  render:
    internal: true
  egress: {}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  prometheus_data:

secrets:
  serptank_database_url: { file: ./secrets/serptank_database_url }
  serptank_owner_database_url: { file: ./secrets/serptank_owner_database_url }
  serptank_scheduler_database_url: { file: ./secrets/serptank_scheduler_database_url }
  serptank_redis_url: { file: ./secrets/serptank_redis_url }
  serptank_session_secret: { file: ./secrets/serptank_session_secret }
  serptank_csrf_secret: { file: ./secrets/serptank_csrf_secret }
  serptank_api_key_pepper: { file: ./secrets/serptank_api_key_pepper }
  serptank_encryption_keys: { file: ./secrets/serptank_encryption_keys }
  serptank_smtp_password: { file: ./secrets/serptank_smtp_password }
  serptank_renderer_token: { file: ./secrets/serptank_renderer_token }
  serptank_google_client_secret: { file: ./secrets/serptank_google_client_secret }
  serptank_google_data_client_secret: { file: ./secrets/serptank_google_data_client_secret }
  serptank_stripe_secret_key: { file: ./secrets/serptank_stripe_secret_key }
  serptank_stripe_webhook_secret: { file: ./secrets/serptank_stripe_webhook_secret }
  serptank_openai_api_key: { file: ./secrets/serptank_openai_api_key }
  serptank_dataforseo_password: { file: ./secrets/serptank_dataforseo_password }
  postgres_owner_password: { file: ./secrets/postgres_owner_password }
  postgres_app_password: { file: ./secrets/postgres_app_password }
  postgres_sched_password: { file: ./secrets/postgres_sched_password }
  redis_password: { file: ./secrets/redis_password }
