# Prometheus for SerpTank (compose profile "monitoring"). Scrapes the API's internal
# metrics port (9100, only reachable on the backend network) and itself.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: serptank-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

# Alertmanager/notification routing is operator-specific; point this at yours:
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ["alertmanager:9093"] }]
